<section id="contact" class="contact-section">
  <p class="section-kicker">CONTACT</p>
  <h2>Let’s build something beautifully useful.</h2>
  <p class="contact-intro">Anything robotics, mechanical design, autonomy, thermal analysis, and rigorously innovative, I'm your guy'.</p>
  <div class="contact-links">
    <button class="contact-button email-button" type="button" data-email="{{ site.email | default: 'muanmeurer@gmail.com' }}"><i class="fa-regular fa-envelope"></i> Show Email</button>
    {% if site.external-links.linkedin %}<a href="https://www.linkedin.com/in/{{ site.external-links.linkedin }}/" target="_blank"><i class="fa-brands fa-linkedin"></i> LinkedIn</a>{% endif %}
    {% if site.external-links.github %}<a href="https://github.com/{{ site.external-links.github }}/" target="_blank"><i class="fa-brands fa-github"></i> GitHub</a>{% endif %}
  </div>
  <p class="email-reveal" aria-live="polite"></p>
</section>
